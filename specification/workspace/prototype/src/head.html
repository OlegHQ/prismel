<title>Prismel Workspace Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*FONT*/
/* Layout: a masthead, then one working editor window (nav | graph/list/lisp | live study + inspector), then short prose.
   Tokens are the Pxui.Theme kit (lib/pxui/theme.ml) plus its port colours; rows are 24 units, text 11. */
:root{
  --paper:#f4f5f0;--ink:#222b2b;--control:#dce3de;--input:#ffffff;--track:#e3e8e4;--accent:#285f77;--on-accent:#f4f5f0;
  --muted:#7e8886;--text2:#5f6a68;--faint:#8b9491;
  --line:rgba(34,43,43,.13);--line-strong:rgba(34,43,43,.42);--hover:#e9f0f1;--pressed:#cfdce0;
  --accent-soft:rgba(40,95,119,.09);--accent-soft2:rgba(40,95,119,.2);
  --canvas:#eaede7;--dot:rgba(34,43,43,.18);--expr-bg:#eef4f6;--shadow:rgba(20,30,30,.16);
  --t-geo:#285f77;--t-float:#b0680f;--t-int:#3b7d4e;--t-vec:#6b50ae;--t-bool:#b0435f;--t-color:#b4531f;--t-out:#222b2b;
  --bad:#b3261e;--good:#3b7d4e;--hint:#f5cf4f;
  --mono:'Departure','IBM Plex Mono',ui-monospace,Menlo,monospace;--code:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#111615;--ink:#e1e7e3;--control:#232c2b;--input:#182020;--track:#1f2827;--accent:#72b3cf;--on-accent:#0f1414;
  --muted:#7f8b87;--text2:#9aa6a2;--faint:#6f7b77;--line:rgba(225,231,227,.10);--line-strong:rgba(225,231,227,.34);--hover:#1c2b2f;--pressed:#24373d;
  --accent-soft:rgba(114,179,207,.10);--accent-soft2:rgba(114,179,207,.24);--canvas:#0c1111;--dot:rgba(225,231,227,.12);--expr-bg:#15252b;--shadow:rgba(0,0,0,.5);
  --t-geo:#72b3cf;--t-float:#e5a54c;--t-int:#74c28e;--t-vec:#a98cf5;--t-bool:#f08aa3;--t-color:#f0935a;--t-out:#e1e7e3;--bad:#ff8a80;--good:#74c28e}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#111615;--ink:#e1e7e3;--control:#232c2b;--input:#182020;--track:#1f2827;--accent:#72b3cf;--on-accent:#0f1414;
  --muted:#7f8b87;--text2:#9aa6a2;--faint:#6f7b77;--line:rgba(225,231,227,.10);--line-strong:rgba(225,231,227,.34);--hover:#1c2b2f;--pressed:#24373d;
  --accent-soft:rgba(114,179,207,.10);--accent-soft2:rgba(114,179,207,.24);--canvas:#0c1111;--dot:rgba(225,231,227,.12);--expr-bg:#15252b;--shadow:rgba(0,0,0,.5);
  --t-geo:#72b3cf;--t-float:#e5a54c;--t-int:#74c28e;--t-vec:#a98cf5;--t-bool:#f08aa3;--t-color:#f0935a;--t-out:#e1e7e3;--bad:#ff8a80;--good:#74c28e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--mono);font-weight:400;letter-spacing:0;text-wrap:balance;margin:0}
p{margin:0 0 12px}
code{font:12.5px var(--code)}
:not(pre)>code{background:var(--track);padding:1px 5px;border-radius:3px}
kbd{font:10px/1.3 var(--mono);background:var(--control);color:var(--ink);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:0 4px;margin-left:6px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0}
.eyebrow{font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.page{max-width:1400px;margin:0 auto;padding:0 20px 56px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;padding-block:36px 20px;border-bottom:1px solid var(--line)}
.mast h1{font-size:clamp(28px,4.2vw,44px);line-height:1.1;margin-top:12px}
.mast .lede{max-width:520px;color:var(--text2);margin:0}
.meta{font:11px/1.6 var(--mono);color:var(--muted);display:grid;grid-template-columns:auto auto;gap:2px 16px}
.meta b{font-weight:400;color:var(--ink)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;padding-block:28px 12px}
.sec-head p{margin:0;color:var(--text2);max-width:640px;font-size:14px}

/* editor window */
.app{border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--paper);box-shadow:0 14px 40px var(--shadow)}
.app-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:30px;padding:3px 10px;background:var(--control);border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--text2)}
.app-top b{font-weight:400;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
#help,.btn,.tools button,.actionbar button,.source-toolbar button,.statusbar button,.inspector-actions button,.field-line button,.tabs button,.nav-item,.list-row,dialog .action{font:11px var(--mono)}
.tools button,.actionbar button,.source-toolbar button,.statusbar button,.inspector-actions button,.field-line button,#help,dialog button:not(#close-dialog),.journeys button{background:var(--control);border:1px solid var(--line);border-radius:3px;height:24px;padding:0 9px;color:var(--ink)}
.tools button:hover:not(:disabled),.actionbar button:hover:not(:disabled),.source-toolbar button:hover,.statusbar button:hover,.inspector-actions button:hover,.field-line button:hover,#help:hover,dialog button:hover:not(#close-dialog){background:var(--hover);border-color:var(--accent)}
button:active:not(:disabled){background:var(--pressed)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent)!important;color:var(--on-accent)!important;border-color:var(--accent)!important}
button.primary:hover{filter:brightness(1.08)}
.editor-grid{display:grid;grid-template-columns:172px minmax(0,1fr) 300px;min-height:600px}
.navigator{padding:6px 0 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper);min-width:0}
.section-label{font:11px var(--mono);letter-spacing:.08em;color:var(--accent);padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;height:24px;padding:0 10px;border:0;border-radius:0;background:none;text-align:left;color:var(--ink)}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-soft2);color:var(--accent)}
.nav-item small{margin-left:auto;font-size:10px;color:var(--muted)}
.ctx{width:8px;height:8px;border-radius:2px;flex:none;background:var(--t-out)}
.ctx-sop{background:var(--t-geo)}.ctx-value{background:var(--t-float)}.ctx-scene{background:var(--t-vec)}.ctx-world{background:var(--t-int)}.ctx-settings{background:var(--t-bool)}.ctx-editor{background:var(--t-color)}
.fnmark{font:italic 12px var(--sans);width:8px;text-align:center;color:var(--t-vec);flex:none}
.nav-note{padding:10px;font:11px/1.6 var(--mono);color:var(--muted);margin-top:auto}
#definitions{margin-bottom:8px}
#help{margin:0 10px;text-align:left}
.workbench{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;height:30px;padding:0 10px;background:var(--control);border-bottom:1px solid var(--line);flex:none}
#breadcrumb{font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#breadcrumb span{color:var(--muted)}
.tabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;flex:none}
.tabs button{background:transparent;border:0;color:var(--text2);height:22px;padding:0 10px;border-radius:0}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
#scope-info{padding:5px 10px;font:11px/1.5 var(--mono);color:var(--text2);background:var(--input);border-bottom:1px solid var(--line);min-height:24px;overflow-wrap:anywhere}
#scope-info strong{font-weight:400;color:var(--t-vec)}
.actionbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:3px 10px;min-height:30px;border-bottom:1px solid var(--line)}
.actionbar .muted{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.projection{flex:1;min-height:420px;max-height:520px;overflow:auto;background:var(--canvas)}
#graph{position:relative;min-width:100%;min-height:420px;background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:16px 16px;outline:none}
#graph:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft2)}
.wires{position:absolute;inset:0;pointer-events:none}
.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}
.w-geo{stroke:var(--t-geo);stroke-width:2.4}.w-float{stroke:var(--t-float);stroke-width:1.5}.w-int{stroke:var(--t-int);stroke-width:1.5}.w-vec{stroke:var(--t-vec);stroke-width:1.8}.w-color{stroke:var(--t-color);stroke-width:1.5}.w-out{stroke:var(--t-out);stroke-width:1.5}
.node{position:absolute;width:158px;padding:0;text-align:left;background:var(--input);border:1px solid var(--line-strong);border-radius:4px;overflow:visible;color:var(--ink)}
.node:hover{border-color:var(--accent)}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.node.function{border-color:var(--t-vec)}
.node.function.selected{border-color:var(--accent)}
.node-title{display:flex;justify-content:space-between;align-items:center;height:24px;padding:0 8px;background:var(--control);border-bottom:1px solid var(--line);border-radius:3px 3px 0 0;font:11px var(--mono)}
.node.function .node-title>span{font:italic 12px var(--sans);color:var(--t-vec)}
.node-op{display:block;height:20px;line-height:20px;padding:0 8px;font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-value{display:block;height:22px;line-height:18px;margin:0 6px 6px;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:var(--track);font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-geo{color:var(--t-geo)}.tc-float{color:var(--t-float)}.tc-int{color:var(--t-int)}.tc-vec{color:var(--t-vec)}.tc-color{color:var(--t-color)}.tc-out{color:var(--ink)}
.sock{position:absolute;top:7px;width:10px;height:10px;border-radius:50%;background:var(--input);border:1.6px solid var(--t-out);pointer-events:none}
.sock.in{left:-6px}.sock.out{right:-6px}
.sock.on{background:currentColor}
.sock.tc-geo{border-color:var(--t-geo)}.sock.tc-float{border-color:var(--t-float)}.sock.tc-int{border-color:var(--t-int)}.sock.tc-vec{border-color:var(--t-vec)}.sock.tc-color{border-color:var(--t-color)}.sock.tc-out{border-color:var(--t-out)}
.group-frame{position:absolute;border:1px dashed var(--line-strong);border-radius:6px;background:var(--accent-soft);color:var(--text2);padding:3px 8px;font:10px var(--mono);letter-spacing:.06em;pointer-events:none}
.graph-result{position:absolute;left:24px;bottom:12px;font:11px var(--mono);color:var(--muted)}
.guide{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding:4px 10px;min-height:24px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted);background:var(--paper)}
.hint{font:11px/1.6 var(--mono);color:var(--text2)}

/* list + source */
#list-view{padding:10px}
#list-view .hint{margin:0 0 8px}
.list-row{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:8px;align-items:center;width:100%;height:28px;margin-bottom:3px;padding:0 8px;text-align:left;background:var(--input);border:1px solid var(--line);border-radius:3px}
.list-row:hover{border-color:var(--accent)}
.list-row.selected{border-color:var(--accent);background:var(--expr-bg);box-shadow:0 0 0 1px var(--accent)}
.list-row strong{font-weight:400}
.list-row code{font:11px var(--code);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.list-row small{font-size:10px;text-align:right;color:var(--muted)}
#text-view{background:var(--input)}
.source-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:3px 10px;min-height:30px;background:var(--control);border-bottom:1px solid var(--line)}
.source-toolbar span{margin-right:auto;font:11px var(--mono);color:var(--text2)}
#source{display:block;width:100%;height:340px;resize:vertical;border:0;border-bottom:1px solid var(--line);background:var(--input);padding:12px;font:12.5px/1.7 var(--code);color:var(--ink);tab-size:2}
.source-note{padding:6px 10px;font:11px/1.5 var(--mono);color:var(--muted)}

/* details column */
.details{background:var(--input);display:flex;flex-direction:column;min-width:0;max-height:640px;overflow:auto}
.preview-head{display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 10px;background:var(--control);border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--text2);flex:none}
#preview{width:100%;height:220px;display:block;flex:none;background:var(--canvas);border-bottom:1px solid var(--line)}
#preview .pgrid{stroke:var(--dot);fill:none;stroke-width:.5}
#preview .ptext{fill:var(--muted);font:9px var(--mono)}
#inspector{padding:0 0 12px;font-size:12px}
#inspector>*{margin-inline:10px}
#inspector>h3{margin:0;padding:10px 10px 0;font-size:14px}
#inspector>.type-label{margin:0;padding:2px 10px 8px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--muted)}
#inspector>p.hint{margin-top:10px}
.badge{display:inline-block;margin-top:8px;font:10px var(--mono);letter-spacing:.06em;padding:1px 6px;border:1px solid var(--accent-soft2);color:var(--accent);border-radius:3px}
.field{margin-top:10px}
.field label{display:block;font:11px var(--mono);color:var(--text2);margin-bottom:4px}
.field-line{display:flex;gap:4px}
.field input:not([type=range]),.field select,dialog input{font-family:var(--mono);width:100%;min-width:0;height:24px;padding:0 6px;font:11px var(--mono);color:var(--ink);background:var(--track);border:1px solid var(--line);border-radius:3px}
.field input:not([type=range]):focus,.field select:focus,dialog input:focus{outline:none;border-color:var(--accent);background:var(--input)}
#expression{color:var(--accent);background:var(--expr-bg);border-color:var(--accent-soft2)}
.field input[type=range]{width:100%;accent-color:var(--accent);height:18px;margin:0}
.connection-label{margin-top:6px}
.inspector-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
#inspector>button{margin-top:10px}

.statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:28px;padding:2px 10px;background:var(--control);border-top:1px solid var(--line);font:11px var(--mono)}
.statusbar #status{flex:1;min-width:200px;color:var(--good)}
.statusbar #status.error{color:var(--bad)}
.statusbar>span:last-child{color:var(--muted)}

/* prose */
.journeys{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.journeys button{height:auto;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--input);border-radius:4px}
.journeys button:hover{border-color:var(--accent);background:var(--hover)}
.journeys span{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.journeys strong{font:14px var(--mono);font-weight:400}
.journeys p{font:13px/1.5 var(--sans);color:var(--text2);margin:0}
.journeys b{font:11px var(--mono);font-weight:400;color:var(--accent);margin-top:auto;padding-top:6px}
.principles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px 64px;padding-block:44px 0}
.principles h2{font-size:22px;line-height:1.3;margin:10px 0 12px}
.principles p{color:var(--text2);max-width:520px}
.principle-list{display:grid;gap:16px;align-content:start}
.principle-list article{border-left:2px solid var(--accent);padding-left:12px}
.principle-list h3{font:14px var(--mono);margin-bottom:4px}
.principle-list p{font-size:13.5px;margin:0}
.limits{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 40px}
.limits h3{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.limits p{font-size:13px;color:var(--text2);margin:0}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font:11px/1.6 var(--mono);color:var(--muted)}

dialog{border:1px solid var(--line-strong);border-radius:6px;background:var(--paper);color:var(--ink);padding:0;width:min(680px,calc(100% - 32px));box-shadow:0 20px 60px var(--shadow)}
dialog::backdrop{background:rgba(10,16,16,.5)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 6px 0 12px;background:var(--control);border-bottom:1px solid var(--line)}
.dialog-head h2{font-size:12px}
#close-dialog{background:none;border:0;font:16px var(--mono);width:24px;height:24px;color:var(--text2)}
#dialog-body{padding:14px 14px 16px;font-size:13.5px}
#dialog-body label{font:11px var(--mono);color:var(--text2);display:block;margin-bottom:4px}
#dialog-body input{margin-bottom:10px}
dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--track);padding:10px;border-radius:3px;font:12px/1.6 var(--code);margin:8px 0 12px}
dialog .action{display:block;width:100%;text-align:left;margin-top:4px;height:28px}
.shell-preview{display:flex;min-height:200px;gap:6px;padding:6px;margin:12px 0;border:1px solid var(--line-strong);border-radius:4px;background:var(--canvas)}
.shell-panel{flex:1;min-width:0;min-height:80px;display:flex;align-items:center;justify-content:center;padding:6px;border:1px solid var(--line-strong);border-radius:3px;background:var(--input);color:var(--accent);font:11px var(--mono);letter-spacing:.06em}
.shell-panel.split{gap:6px;padding:4px;background:var(--control)}
.shell-panel.vertical{flex-direction:column}
.shell-panel.floating{border-color:var(--t-vec);box-shadow:4px 5px 0 var(--accent-soft2);transform:translate(-3px,-3px)}

@media(max-width:1100px){.editor-grid{grid-template-columns:148px minmax(0,1fr) 260px}}
@media(max-width:860px){
  .editor-grid{grid-template-columns:minmax(0,1fr)}
  .navigator{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:4px 6px;gap:0 4px}
  .navigator .section-label{width:100%}
  .nav-item{width:auto;padding:0 8px}
  .nav-note{display:none}
  #definitions{display:contents}
  #scopes{display:contents}
  #help{margin:0 4px}
  .workbench{border-right:0;border-bottom:1px solid var(--line)}
  .details{max-height:none}
  .principles{grid-template-columns:1fr}
  .list-row{grid-template-columns:90px minmax(0,1fr)}.list-row small{display:none}
  .guide span:last-child{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* ---------- composed shell ---------- */
.app-top #help{margin:0}
.shell{position:relative;height:720px;display:flex;background:var(--line)}
.shell>.root{flex:1;min-width:0;min-height:0}
.split{display:flex;min-width:0;min-height:0}
.split.h{flex-direction:row}.split.v{flex-direction:column}
.split>*{min-width:0;min-height:0}
.gutter{flex:none;background:var(--line);outline:none;touch-action:none}
.split.h>.gutter{width:6px;cursor:col-resize}.split.v>.gutter{height:6px;cursor:row-resize}
.gutter:hover,.gutter:focus-visible{background:var(--accent-soft2)}
.panel{display:flex;flex-direction:column;background:var(--paper);min-width:0;min-height:0;overflow:hidden;position:relative}
.panel.flash{box-shadow:inset 0 0 0 2px var(--accent)}
.phead{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 6px;background:var(--control);border-bottom:1px solid var(--line);flex:none;font:11px var(--mono)}
.kindsel{font:11px var(--mono);height:22px;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink);padding:0 2px;max-width:104px}
.kindsel:hover{border-color:var(--line-strong)}
.ptitle{background:none;border:0;font:11px var(--mono);color:var(--muted);padding:0 4px;height:22px;border-radius:3px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptitle:hover{color:var(--accent);background:var(--accent-soft)}
.pctl{display:flex;gap:4px;align-items:center;min-width:0;overflow:hidden}
.pctl button{font:11px var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:3px;height:22px;padding:0 7px;color:var(--ink);white-space:nowrap}
.pctl button:hover:not(:disabled){border-color:var(--accent);background:var(--hover)}
.pctl button:disabled{opacity:.4}
.pctl kbd{margin-left:5px}
.scopesel{font:11px var(--mono);height:22px;background:var(--paper);border:1px solid var(--line);border-radius:3px;color:var(--ink);max-width:120px}
.ptag{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.pbtn{width:22px;height:22px;border:0!important;background:none!important;color:var(--muted);display:grid;place-items:center;border-radius:3px;padding:0!important}
.pbtn:hover{background:var(--hover)!important;color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;position:relative;display:flex;flex-direction:column}
.pbody.graph{overflow:hidden}
.pbody>.gscroll{flex:1}
.floatwrap{position:relative;display:block}
.floatwrap>:first-child{position:absolute;inset:0}
.floating{position:absolute;right:14px;top:14px;width:min(340px,80%);height:min(460px,72%);border:1px solid var(--line-strong);box-shadow:0 10px 30px var(--shadow);display:flex;flex-direction:column;z-index:3;background:var(--paper)}
.floating>.panel{flex:1}

/* graph canvas */
.gscroll{overflow:auto;background-color:var(--canvas);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:16px 16px;background-attachment:local;outline:none;touch-action:pan-x pan-y}
.gscroll:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft2)}
.gscroll.wiring{cursor:crosshair}
.gcanvas{position:relative;min-width:100%;min-height:100%}
.node{position:absolute;background:var(--input);border:1px solid var(--line-strong);border-radius:4px;outline:none;user-select:none;-webkit-user-select:none}
.node:focus-visible{box-shadow:0 0 0 2px var(--accent-soft2)}
.node.function{border-color:var(--t-vec)}
.node.return{border-style:dashed}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.ntitle{position:relative;display:flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;background:var(--control);border-bottom:1px solid var(--line);border-radius:3px 3px 0 0;cursor:grab;font:11px var(--mono)}
.node.function .ntitle{background:color-mix(in srgb,var(--control) 82%,var(--t-vec))}
.nname{flex:none;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.nop{margin-left:auto;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.foldbtn{flex:none;font:italic 12px/1 var(--sans);width:18px;height:16px;padding:0;border:1px solid var(--accent);color:var(--accent);background:var(--input);border-radius:3px}
.foldbtn:hover{background:var(--accent-soft2)}
.arow{position:relative;display:flex;align-items:center;height:24px;padding:0 6px 0 10px;gap:6px}
.arow.psel{background:var(--accent-soft)}
.arow.ok{background:var(--accent-soft2)}
.arow.ok .sock.in{transform:scale(1.35)}
.alabel{flex:none;width:58px;font:11px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.aval{flex:1;min-width:0;height:18px;line-height:16px;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:var(--track);font:11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.aval.num{cursor:ew-resize}
.aval.num:hover{border-color:var(--accent);background:var(--input)}
.aval.conn{background:transparent;border-color:transparent;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.aval.chip{display:flex;align-items:center;gap:5px;padding:0 4px 0 0;background:var(--expr-bg);border-color:var(--accent-soft2);color:var(--accent)}
.fbtn{flex:none;display:grid;place-items:center;width:18px;height:100%;font:italic 12px var(--sans);border-right:1px solid var(--accent-soft2);cursor:pointer}
.fbtn:hover{background:var(--accent-soft2)}
.ctext{min-width:0;overflow:hidden;text-overflow:ellipsis}
.aedit{flex:1;min-width:0;height:18px;font:11px var(--code);color:var(--accent);background:var(--expr-bg);border:1px solid var(--accent);border-radius:3px;padding:0 5px;outline:none}
.nfoot{height:20px;line-height:18px;padding:0 10px;border-top:1px solid var(--line);font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sock{position:absolute;top:7px;width:10px;height:10px;border-radius:50%;background:var(--input);border:1.6px solid currentColor;z-index:2}
.sock.in{left:-6px}.sock.out{right:-6px;cursor:crosshair}
.sock.out::after,.sock.in::after{content:'';position:absolute;inset:-6px}
.sock.on{background:currentColor}
.wire.dashed{stroke-dasharray:3 4}
.tmpw{stroke-dasharray:5 4}
.group-frame{pointer-events:none}
.glabel{pointer-events:auto;background:none;border:0;padding:0;font:10px var(--mono);letter-spacing:.06em;color:var(--text2)}
.glabel:hover{color:var(--accent)}

/* navigator */
.pbody.outline{overflow:hidden}
.ol-search{flex:none;margin:6px;width:calc(100% - 12px);height:24px;font:11px var(--mono);background:var(--track);border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--ink)}
.ol-search:focus{outline:none;border-color:var(--accent);background:var(--input)}
.ol-tree{overflow:auto;flex:1;padding-bottom:8px}
.ol-sec{font:11px var(--mono);letter-spacing:.08em;color:var(--accent);padding:10px 10px 3px}
.ol-row{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 10px;font:11px var(--mono);cursor:pointer;white-space:nowrap}
.ol-row:hover{background:var(--hover)}
.ol-row.active{background:var(--accent-soft2);color:var(--accent)}
.ol-row>span{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ol-row>small{color:var(--muted);font-size:10px;max-width:52%;overflow:hidden;text-overflow:ellipsis;flex:none}
.ol-row.leaf{padding-left:24px;height:22px}
.ol-row.leaf.sel{background:var(--accent-soft2)}
.ol-row[draggable=true]{cursor:grab}
.ol-row.pt{padding-left:calc(10px + var(--d,0)*12px);cursor:default}
.ol-row.leafp{cursor:pointer}
.ol-row .mini{flex:none;font:10px var(--mono);height:16px;padding:0 4px;border:1px solid var(--line);border-radius:3px;background:none;color:var(--muted);display:none}
.ol-row.leafp:hover .mini{display:block}
.ol-row .mini:hover{color:var(--accent);border-color:var(--accent)}
.tsq{width:7px;height:7px;border-radius:2px;flex:none;background:currentColor}
.tsq.pk-graph{color:var(--t-geo)}.tsq.pk-lisp{color:var(--t-vec)}.tsq.pk-list{color:var(--t-int)}.tsq.pk-inspector{color:var(--t-float)}.tsq.pk-viewport{color:var(--t-color)}.tsq.pk-outline{color:var(--t-bool)}
.tsq.sp-h,.tsq.sp-v,.tsq.sp-f{color:var(--muted);background:none;border:1px solid currentColor}
.tsq.sp-v{border-top-width:3px}.tsq.sp-h{border-left-width:3px}
.flow{padding:2px 10px;font:11px var(--mono);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.flow em,.usedby em{color:var(--muted);font-style:normal}
.fl{color:var(--muted);width:100%;font-size:10px;margin-top:2px}
.usedby .fl{width:auto;margin:0}
.chip2{font:11px var(--mono);height:20px;padding:0 6px;background:var(--track);border:1px solid var(--line);border-radius:3px;color:var(--ink)}
.chip2:hover{border-color:var(--accent);color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 4px}
.presets button,.olhelp{font:11px var(--mono);height:22px;padding:0 7px;background:var(--control);border:1px solid var(--line);border-radius:3px;color:var(--ink)}
.presets button:hover,.olhelp:hover{border-color:var(--accent);background:var(--hover)}
.olhelp{margin:4px 10px}

/* lisp panel */
.pbody.lisp{background:var(--input)}
.ctabs{display:flex;flex:none;border-bottom:1px solid var(--line);background:var(--paper)}
.ctabs button{flex:1;height:26px;background:none;border:0;border-bottom:2px solid transparent;font:11px var(--mono);color:var(--muted);border-radius:0}
.ctabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.ctabs button.dirty::after{content:' ●';color:var(--bad)}
.csel{flex:1;overflow:auto;padding:6px 0 10px;background:var(--input);font:12px/1.65 var(--code)}
.cl{padding:0 12px;white-space:pre;cursor:pointer;border-left:2px solid transparent;min-width:max-content}
.cl code{font:inherit}
.cl:hover{background:var(--hover)}
.cl.sel{background:var(--accent-soft2);border-left-color:var(--accent)}
.cl.dep{opacity:.62}
.cl.end{cursor:default}
.cnote{color:var(--muted);padding:2px 12px 6px;font:11px/1.5 var(--mono)}
.kw{color:var(--t-vec)}.str{color:var(--t-color)}.nm{color:var(--t-geo)}
mark{background:color-mix(in srgb,var(--hint) 55%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.ledit{width:min(70%,32em);font:12px var(--code)}
.defpeek{margin:6px 12px 8px;background:var(--track);padding:8px;border-radius:3px;font:12px/1.6 var(--code);white-space:pre-wrap;overflow-wrap:anywhere}
.open-def,.open-macro{margin:0 12px 8px;font:11px var(--mono);height:24px;padding:0 9px;background:var(--control);border:1px solid var(--line);border-radius:3px;color:var(--ink)}
.cdoc{flex:1;display:flex;flex-direction:column;min-height:0}
.doc-src{flex:1;min-height:120px;width:100%;resize:none;border:0;border-bottom:1px solid var(--line);background:var(--input);padding:12px;font:12px/1.65 var(--code);color:var(--ink);tab-size:2}

/* viewport + inspector + list */
.pbody.viewport{background:var(--canvas);color:var(--ink)}
.pv{width:100%;height:100%;display:block}
.pv .pgrid{stroke:var(--dot);fill:none;stroke-width:.5}
.pv .ptext{fill:var(--muted);font:9px var(--mono)}
.pbody.inspector{background:var(--input)}
.ibody{padding:0 0 12px;font-size:12px}
.ibody>*{margin-inline:10px}
.ibody>h3{margin:0;padding:10px 10px 0;font-size:14px}
.ibody>.type-label{margin:0;padding:2px 10px 8px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--muted)}
.ibody>p.hint{margin-top:10px}
.ibody>button{margin-top:10px}
.ibody .field-line button,.ibody .inspector-actions button,.ibody>button{background:var(--control);border:1px solid var(--line);border-radius:3px;height:24px;padding:0 9px;font:11px var(--mono)}
.fold-help{padding:8px 10px;border:1px solid var(--accent-soft2);background:var(--expr-bg);border-radius:3px;font:11px/1.6 var(--mono);color:var(--text2);margin-top:12px}
.fold-help b{font:italic 13px var(--sans);color:var(--accent)}
.usedby{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:11px var(--mono)}
.lbody{padding:10px}
.lbody .hint{margin:0 0 8px}
.pbody.list{background:var(--canvas)}
.pal{display:flex!important;justify-content:space-between;gap:12px;height:28px}
.pal span{color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal.cur{border-color:var(--accent)!important;background:var(--hover)!important}
#pal-list{max-height:280px;overflow:auto;margin-bottom:8px}
.empty{padding:20px;font:11px var(--mono);color:var(--muted)}
@media(max-width:860px){
  .shell{height:auto;flex-direction:column}
  .split{flex-direction:column!important}
  .split>*{flex:none!important}
  .panel{min-height:400px}
  .pbody.graph .gscroll{min-height:360px}
  .gutter{display:none}
  .floatwrap>:first-child{position:static}
  .floating{position:static;width:auto;height:auto;box-shadow:none}
  .pv{height:280px}
}
.cl code,.defpeek code{background:none;padding:0;border-radius:0}
.ol-row>.fnmark{flex:none}
.panel{container-type:inline-size}
@container (max-width:300px){.ptitle{display:none}.kindsel{max-width:96px}}
.shell{height:760px}
.sock{pointer-events:auto}

/* ---------- v3: zones, rails, strips, probes ---------- */
:root{--z-for:rgba(40,95,119,.075);--z-for-b:rgba(40,95,119,.42);--z-fold:rgba(107,80,174,.075);--z-fold-b:rgba(107,80,174,.5);--z-sum:rgba(176,104,15,.08);--z-sum-b:rgba(176,104,15,.5);--z-let-b:rgba(34,43,43,.34)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--z-for:rgba(114,179,207,.07);--z-for-b:rgba(114,179,207,.42);--z-fold:rgba(169,140,245,.08);--z-fold-b:rgba(169,140,245,.5);--z-sum:rgba(229,165,76,.08);--z-sum-b:rgba(229,165,76,.5);--z-let-b:rgba(225,231,227,.3)}}
:root[data-theme="dark"]{--z-for:rgba(114,179,207,.07);--z-for-b:rgba(114,179,207,.42);--z-fold:rgba(169,140,245,.08);--z-fold-b:rgba(169,140,245,.5);--z-sum:rgba(229,165,76,.08);--z-sum-b:rgba(229,165,76,.5);--z-let-b:rgba(225,231,227,.3)}
.zone-bg{position:absolute;border-radius:6px;border:1px solid var(--z-for-b);background:var(--z-for)}
.zone-bg.z-fold,.zone-bg.z-scan{border-color:var(--z-fold-b);background:var(--z-fold)}
.zone-bg.z-sum{border-color:var(--z-sum-b);background:var(--z-sum)}
.zone-bg.z-let{border:1px dashed var(--z-let-b);background:transparent}
.zone-bg.selected{box-shadow:0 0 0 1.5px var(--accent)}
.zone-fg{position:absolute;pointer-events:none}
.zone-fg>*{pointer-events:auto}
.ztitle{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;font:11px var(--mono);cursor:grab;border-bottom:1px solid var(--line)}
.ztog{width:18px;height:18px;padding:0;border:0;background:none;color:var(--muted);font:10px var(--mono);border-radius:3px}
.ztog:hover{background:var(--hover);color:var(--accent)}
.zglyph{font:10px/16px var(--mono);height:16px;padding:0 5px;border-radius:3px;background:var(--accent);color:var(--on-accent);letter-spacing:.02em}
.zone-fg:has(+ *) .zglyph{}
.z-fold .zglyph,.zone-card.z-fold .zglyph,.z-scan .zglyph{background:var(--t-vec)}
.z-sum .zglyph,.zone-card.z-sum .zglyph{background:var(--t-float)}
.z-let .zglyph,.zone-card.z-let .zglyph{background:none;color:var(--text2);border:1px dashed var(--line-strong)}
.zone-fg .sock.out,.zone-card .ztitle .sock.out{top:7px}
.zone-fg>.ztitle>.sock.out{right:-6px}
.zstrip{position:absolute;left:0;right:0;top:24px;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);cursor:ew-resize;touch-action:none;user-select:none}
.zcells{display:flex;gap:2px;align-items:flex-end;height:26px;min-width:0;overflow:hidden}
.tcell{display:grid;place-items:center;width:22px;height:26px;border-radius:3px;color:var(--text2)}
.tcell.on{background:var(--accent-soft2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tcell.bar{align-items:end;padding-bottom:3px}.tcell.bar i{display:block;width:10px;background:currentColor;opacity:.55;border-radius:1px}
.tcell.on.bar i{opacity:1}
.tcell.dotc{font:10px var(--mono)}
.thumb{display:block}.thumb polygon,.thumb polyline{fill:none;stroke:currentColor;stroke-width:.9}.thumb circle{fill:currentColor}
.zread{margin-left:auto;font:10px var(--mono);color:var(--muted);white-space:nowrap}
.zread b{font-weight:400;color:var(--ink)}
.rail{position:absolute;left:0}
.rrow{position:relative;display:flex;align-items:center;gap:5px;height:24px;padding:0 10px 0 10px;font:11px var(--mono)}
.rrow .rname{flex:none;max-width:60px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rrow.iter .rname,.rrow.acc .rname{font-weight:500;color:var(--accent)}
.rrow.acc .rname{color:var(--t-vec)}
.rrow .rrole{flex:none;color:var(--muted);font-size:10px}
.rrow .rnote{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .aval{max-width:78px}
.rrow.ok,.yrow.ok{background:var(--accent-soft2)}
.rrow .sock.src{right:-6px;left:auto}
.rrow.capture .rname{color:var(--text2)}
.yrow{position:absolute;display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 12px;font:11px var(--mono);border-left:1px dashed var(--line-strong)}
.yrow .rname{color:var(--muted)}
.yrow .aval{background:transparent;border-color:transparent}
.zkindnote{position:absolute;right:10px;bottom:3px;font:10px var(--mono);color:var(--muted);pointer-events:none}
.feedback{fill:none;stroke:var(--t-vec);stroke-width:1.4;stroke-dasharray:4 3}
.fbl{font:10px var(--mono);fill:var(--t-vec);text-anchor:middle}
.glink{fill:none;stroke:var(--t-color);stroke-width:1.2;stroke-dasharray:1 3;stroke-linecap:round}
.gll{font:10px var(--mono);fill:var(--t-color);text-anchor:middle}
.zone-card{border-style:solid;box-shadow:3px 3px 0 -1px var(--input),3px 3px 0 0 var(--line-strong),6px 6px 0 -1px var(--input),6px 6px 0 0 var(--line-strong)}
.zone-card .ztitle{position:relative;background:var(--control);border-radius:3px 3px 0 0}
.zone-card .rrow .sock.in{left:-6px}
.node.synth .nname{color:var(--muted)}
.sock.multi{border-radius:2px;box-shadow:2px 2px 0 -1px var(--input),2px 2px 0 0 currentColor}
.sock.tc-geo:not(.multi){border-radius:1px}
.sock.tc-bool{color:var(--t-bool)}
.tc-bool{color:var(--t-bool)}
.w-bool{stroke:var(--t-bool);stroke-width:1.5}
.nfoot{display:flex;align-items:center;gap:6px}
.nfoot .fv{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.nfoot em{font-style:normal;color:var(--muted)}
.spark{flex:none;margin-left:auto}.spark path{fill:none;stroke:currentColor;stroke-width:1.1}.spark circle{fill:currentColor}
.fb{flex:none;margin-left:auto;font-size:10px;color:var(--muted)}
.spark+.fb{margin-left:0}
.inv{flex:none;margin-left:auto;font:10px var(--mono);height:16px;padding:0 5px;border:1px solid var(--good);color:var(--good);background:var(--input);border-radius:8px;cursor:pointer}
.spark+.inv{margin-left:0}
.inv:hover{background:var(--good);color:var(--input)}
.tnum{cursor:ew-resize;border-bottom:1px dotted currentColor}
.tnum:hover{background:var(--accent-soft2)}
.tsym{color:var(--t-geo)}.tkw{color:var(--muted)}.tstr{color:var(--t-color)}
.ctext b{font-weight:500}
.aval.chip.zchip .fbtn i{font:10px var(--mono);font-style:normal}
.aval.zchip{background:var(--z-for);border-color:var(--z-for-b)}
.aval.zchip.z-sum{background:var(--z-sum);border-color:var(--z-sum-b);color:var(--t-float)}
.aval.zchip.z-fold{background:var(--z-fold);border-color:var(--z-fold-b);color:var(--t-vec)}
.aval.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.aval.vecv{cursor:default}.aval.vecv .tnum{margin:0 1px}
.aval.txt{display:flex;align-items:center;gap:4px}
.swatch{width:9px;height:9px;border-radius:2px;border:1px solid var(--line-strong);flex:none}
.gicon{font-style:normal;color:var(--t-color)}
.warn{font-style:normal;color:var(--bad);font-weight:600}
.arow.addrow{opacity:.7}.arow.addrow .alabel{font-style:italic}
.tex{color:var(--accent)}
/* inspector additions */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:8px 10px 0;font:10px var(--mono);color:var(--muted)}
.crumbs .sep{margin:0 2px}
.crumb{font:10px var(--mono);background:none;border:0;padding:0 3px;height:18px;color:var(--accent);border-radius:3px}
.crumb em{font-style:normal;color:var(--muted)}
.crumb:hover{background:var(--hover)}
.rename{display:flex;gap:4px;padding:6px 10px 0}
